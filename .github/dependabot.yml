version: 2

registries:
  acf:
    type: composer-repository
    url: https://connect.advancedcustomfields.com
    username: ${{ secrets.ACF_PRO_KEY }}
    password: https://northwind-demo.ddev.site

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    registries: [acf]
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /tests/a11y
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      a11y-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Composer reads this to authenticate against the private ACF repository.
  # The key is a repository secret (and a Dependabot secret for Dependabot PRs).
  COMPOSER_AUTH: '{"http-basic":{"connect.advancedcustomfields.com":{"username":"${{ secrets.ACF_PRO_KEY }}","password":"https://northwind-demo.ddev.site"}}}'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: |
          find web/app/mu-plugins/northwind-core web/app/themes/northwind config -name '*.php' -print0 \
            | xargs -0 -n 1 php -l > /dev/null

      - name: WordPress Coding Standards (PHPCS)
        run: composer lint

      - name: Validate JSON (theme.json, block.json, ACF field groups)
        run: |
          # shellcheck disable=SC2016 # $argv is PHP, not shell.
          find web/app/themes/northwind web/app/mu-plugins/northwind-core -name '*.json' -print0 \
            | xargs -0 -n 1 php -r 'json_decode(file_get_contents($argv[1]), flags: JSON_THROW_ON_ERROR);'

      - name: Lint workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  build:
    name: WP Engine build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Build the deploy artifact
        run: scripts/build-wpengine.sh

      - name: Check the artifact contains no secrets
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
        run: |
          test -n "$ACF_PRO_KEY"
          if grep -rqF -- "$ACF_PRO_KEY" build; then
            echo "::error::The ACF license key was found in the build artifact."
            exit 1
          fi
          if find build -name auth.json -o -name '.env*' | grep -q .; then
            echo "::error::auth.json or a .env file was found in the build artifact."
            exit 1
          fi
